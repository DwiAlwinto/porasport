# =====================================================================
# SonarQube / SonarCloud Configuration for DISBUDPORA Sport Bekasi
# =====================================================================

# 1. Project Identification
sonar.projectKey=sport-bekasi-disbudpora
sonar.projectName=Sport Bekasi - DISBUDPORA
sonar.projectVersion=1.0.0

# 2. Source & Test Folders
sonar.sources=src
sonar.tests=scripts
sonar.test.inclusions=scripts/**/*.ts

# 3. Encoding
sonar.sourceEncoding=UTF-8

# 4. Exclusions (Jangan scan folder build, aset statis, atau dokumentasi)
sonar.exclusions=**/node_modules/**,**/.next/**,**/public/**,**/coverage/**,**/*.docx,**/*.html,**/*.png,**/*.jpg,**/*.jpeg,**/*.svg,**/*.ico,prisma/migrations/**

# 5. TypeScript / JavaScript Analysis Settings
sonar.javascript.environments=browser,node
sonar.typescript.tsconfigPath=tsconfig.json

# 6. Default Server URL (Dapat diubah sesuai host SonarQube Anda atau via -Dsonar.host.url)
sonar.host.url=http://localhost:9000

# 7. Coverage Report (Opsional jika menjalankan testing coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
